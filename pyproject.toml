[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-leviathan"
version = "2.0.0"
description = "PROJECT-LEVIATHAN terminal toolkit"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "rich>=13.7.0",
]

[project.scripts]
project-leviathan = "ProyekLV:main"
